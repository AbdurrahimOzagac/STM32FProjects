<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STM32 AHRS Telemetry Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 220px;
    }
    button {
      width: 100%;
      background: #007acc;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #005999; }
    button:disabled { background: #444; cursor: not-allowed; }
    .data-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px;
    }
    .data-val {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #4fc3f7;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #ffb74d;
      text-align: center;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <button id="btn-connect">Seri Porta Bağlan</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 12px 0;">
    <div class="data-row"><span>Roll:</span><span id="val-roll" class="data-val">0.00°</span></div>
    <div class="data-row"><span>Pitch:</span><span id="val-pitch" class="data-val">0.00°</span></div>
    <div class="data-row"><span>Yaw:</span><span id="val-yaw" class="data-val">0.00°</span></div>
    <div class="data-row"><span>Altitude:</span><span id="val-alt" class="data-val">0.00 m</span></div>
  </div>

  <script>
    /* ==========================================================================
       1. THREE.JS 3D SCENE SETUP
       ========================================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14141a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 3, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Helpers
    const grid = new THREE.GridHelper(10, 20, 0x444455, 0x222233);
    grid.position.y = -1.5;
    scene.add(grid);

    const axesHelper = new THREE.AxesHelper(1.5);
    scene.add(axesHelper);

    /* ==========================================================================
       2. AIRCRAFT / IMU 3D MODEL
       ========================================================================== */
    const craftGroup = new THREE.Group();

    // Fuselage (Body)
    const bodyGeo = new THREE.BoxGeometry(0.5, 0.2, 2.0);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.2, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    craftGroup.add(body);

    // Main Wings (X-axis)
    const wingGeo = new THREE.BoxGeometry(2.4, 0.04, 0.4);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x007acc });
    const wing = new THREE.Mesh(wingGeo, wingMat);
    wing.position.set(0, 0.02, 0.1);
    craftGroup.add(wing);

    // Vertical Stabilizer (Tail fin)
    const tailGeo = new THREE.BoxGeometry(0.04, 0.5, 0.3);
    const tailMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
    const tail = new THREE.Mesh(tailGeo, tailMat);
    tail.position.set(0, 0.3, 0.85);
    craftGroup.add(tail);

    // Nose Indicator (Forward Direction)
    const noseGeo = new THREE.ConeGeometry(0.2, 0.4, 16);
    const noseMat = new THREE.MeshStandardMaterial({ color: 0xffa000 });
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.rotation.x = -Math.PI / 2;
    nose.position.set(0, 0, -1.1);
    craftGroup.add(nose);

    scene.add(craftGroup);

    /* ==========================================================================
       2b. NORTH (KUZEY) INDICATOR
       Sabit, dünya çerçevesine göre (world-frame) durur; craftGroup ile birlikte
       dönmez. Yaw = 0 anında sensörün baktığı yönü "kuzey" kabul ediyoruz
       (-Z ekseni), bu yüzden ok da -Z yönünü gösteriyor. Kalibrasyonunuz farklıysa
       aşağıdaki NORTH_DIR vektörünü değiştirin.
       ========================================================================== */
    function makeTextSprite(text, color = '#ff5252') {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold 80px Segoe UI, sans-serif';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 68);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(0.5, 0.5, 1);
      return sprite;
    }

    const northGroup = new THREE.Group();

    const NORTH_DIR = new THREE.Vector3(0, 0, -1); // yaw=0 referans yönü
    const NORTH_DIST = 3.2;

    const northArrowDir = NORTH_DIR.clone().normalize();
    const northArrow = new THREE.ArrowHelper(
      northArrowDir,
      new THREE.Vector3(0, -1.48, 0),  // grid seviyesinden başlasın
      NORTH_DIST,
      0xff5252,
      0.35,
      0.2
    );
    northGroup.add(northArrow);

    const northLabel = makeTextSprite('K'); // Kuzey
    northLabel.position.copy(northArrowDir.clone().multiplyScalar(NORTH_DIST + 0.4));
    northLabel.position.y = -1.0;
    northGroup.add(northLabel);

    // craftGroup'a EKLENMEDİ -> sahneye doğrudan eklenerek dünya çerçevesinde sabit kalır
    scene.add(northGroup);

    /* ==========================================================================
       2c. KAMERA KONTROLÜ (SÜRÜKLE-DÖNDÜR + TEKERLEK/PINCH ZOOM)
       Harici bir OrbitControls scripti eklemek yerine (r128 için cdnjs'te
       examples/js klasörü garantili barınmıyor), hedef nokta etrafında küresel
       koordinatlarla (theta/phi/radius) çalışan hafif bir kontrol yazdık.
       ========================================================================== */
    const cameraTarget = new THREE.Vector3(0, 0, 0);
    const camSpherical = new THREE.Spherical();
    camSpherical.setFromVector3(camera.position.clone().sub(cameraTarget));

    const ROTATE_SPEED = 0.006;
    const MIN_PHI = 0.05;
    const MAX_PHI = Math.PI - 0.05;
    const MIN_RADIUS = 2.5;
    const MAX_RADIUS = 25;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function updateCameraFromSpherical() {
      const pos = new THREE.Vector3().setFromSpherical(camSpherical).add(cameraTarget);
      camera.position.copy(pos);
      camera.lookAt(cameraTarget);
    }

    renderer.domElement.style.touchAction = 'none'; // mobil kaydırma jestleriyle çakışmasın
    renderer.domElement.style.cursor = 'grab';

    const activePointers = new Map();
    let pinchStartDist = null;
    let pinchStartRadius = null;

    function getPointerDistance() {
      const pts = Array.from(activePointers.values());
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      return Math.hypot(dx, dy);
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      renderer.domElement.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      renderer.domElement.style.cursor = 'grabbing';
      if (activePointers.size === 2) {
        pinchStartDist = getPointerDistance();
        pinchStartRadius = camSpherical.radius;
      }
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const prev = activePointers.get(e.pointerId);
      const dx = e.clientX - prev.x;
      const dy = e.clientY - prev.y;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 1) {
        // Tek parmak / fare sürükleme -> döndürme
        camSpherical.theta -= dx * ROTATE_SPEED;
        camSpherical.phi = clamp(camSpherical.phi - dy * ROTATE_SPEED, MIN_PHI, MAX_PHI);
        updateCameraFromSpherical();
      } else if (activePointers.size === 2 && pinchStartDist) {
        // İki parmak (pinch) -> zoom
        const dist = getPointerDistance();
        const scale = pinchStartDist / dist;
        camSpherical.radius = clamp(pinchStartRadius * scale, MIN_RADIUS, MAX_RADIUS);
        updateCameraFromSpherical();
      }
    });

    function releasePointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) {
        renderer.domElement.style.cursor = 'grab';
      }
      if (activePointers.size < 2) {
        pinchStartDist = null;
        pinchStartRadius = null;
      }
    }
    renderer.domElement.addEventListener('pointerup', releasePointer);
    renderer.domElement.addEventListener('pointercancel', releasePointer);
    renderer.domElement.addEventListener('pointerleave', releasePointer);

    // Masaüstünde fare tekerleği ile zoom
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = Math.exp(e.deltaY * 0.001);
      camSpherical.radius = clamp(camSpherical.radius * zoomFactor, MIN_RADIUS, MAX_RADIUS);
      updateCameraFromSpherical();
    }, { passive: false });

    /* ==========================================================================
       3. ORIENTATION & TELEMETRY UPDATE
       ========================================================================== */
    const toRad = Math.PI / 180;

    function updateOrientation(rollDeg, pitchDeg, yawDeg) {
      /*
       * Invert or swap signs directly here if visual orientation requires it.
       * Roll: negative sign applied if board rolled opposite.
       */
      // Three.js'te kanat X ekseninde (sağ=+X, sol=-X), burun -Z yönünde.
      // Bu düzende pozitif Z-rotasyonu sol kanadı aşağı götürür, ki sensörünüzün
      // de "sol kanat aşağı = artan roll" kuralıyla birebir örtüşüyor.
      // Bu yüzden işaret çevirmeye gerek yok (eski "-" işareti rolü tersine çeviriyordu).
      const r = rollDeg * toRad;
      const p = pitchDeg * toRad;
      const y = yawDeg * toRad;

      // Z-X-Y Euler rotation order
      craftGroup.rotation.set(0, 0, 0);
      craftGroup.rotation.order = 'YXZ';
      craftGroup.rotation.y = y;
      craftGroup.rotation.x = p;
      craftGroup.rotation.z = r;
      // Not: northGroup craftGroup'un dışında olduğu için burada elle
      // güncellenmesine gerek yok; kuzey oku her zaman sahitede sabit kalır.
    }

    /* ==========================================================================
       4. WEB SERIAL API (DIRECT BROWSER UART)
       ========================================================================== */
    const btnConnect = document.getElementById('btn-connect');
    const statusDiv  = document.getElementById('status');
    const valRoll    = document.getElementById('val-roll');
    const valPitch   = document.getElementById('val-pitch');
    const valYaw     = document.getElementById('val-yaw');
    const valAlt     = document.getElementById('val-alt');

    let currentPort = null;
    let currentReader = null;

    function setStatus(text, color) {
      statusDiv.innerText = text;
      statusDiv.style.color = color;
    }

    function parseAndApplyLine(line) {
      const cleanLine = line.trim();
      if (!cleanLine) return;

      const parts = cleanLine.split(',');
      if (parts.length === 4) {
        const roll  = parseFloat(parts[0]);
        const pitch = parseFloat(parts[1]);
        const yaw   = parseFloat(parts[2]);
        const alt   = parseFloat(parts[3]);

        if (!isNaN(roll) && !isNaN(pitch) && !isNaN(yaw)) {
          valRoll.innerText  = roll.toFixed(2) + '°';
          valPitch.innerText = pitch.toFixed(2) + '°';
          valYaw.innerText   = yaw.toFixed(2) + '°';
          valAlt.innerText   = alt.toFixed(2) + ' m';

          updateOrientation(roll, pitch, yaw);
        }
      }
    }

    // Web Serial'in dahili buffer'ı okuma hızından daha yavaş tüketilirse
    // (örn. sekme arka planda kısılırsa, ya da satır işleme main thread'i
    // bloklarsa) "Buffer overrun" hatası fırlatılır. Çözüm iki parçalı:
    //   1) port.open() içinde bufferSize'ı büyütmek (varsayılan 255 byte,
    //      20 Hz @ 115200 baud'da kolayca dolabilir).
    //   2) reader.read() döngüsünü try/catch ile sarıp, overrun gibi
    //      kurtarılabilir hatalarda tüm uygulamayı çökertmeden reader'ı
    //      sıfırlayıp okumaya devam etmek.
    async function readLoop(reader) {
      let buffer = '';

      while (true) {
        let result;
        try {
          result = await reader.read();
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          console.warn('Seri okuma hatası:', msg);

          if (msg.toLowerCase().includes('overrun')) {
            // Kurtarılabilir hata: buffer taştı ama port hala açık.
            // Reader'ı bırak, aynı port üzerinde yeni bir reader ile devam et.
            setStatus('Buffer overrun - okuma yeniden başlatılıyor...', '#ffb74d');
            try { reader.releaseLock(); } catch (e) { /* yoksay */ }
            return 'retry';
          }

          // Kurtarılamayan hata (port çekildi, vb.)
          setStatus('Bağlantı koptu: ' + msg, '#e57373');
          return 'fatal';
        }

        const { value, done } = result;
        if (done) return 'closed';

        if (value) {
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Keep unfinished line fragment
          for (const line of lines) {
            parseAndApplyLine(line);
          }
        }
      }
    }

    async function connectAndStream() {
      const port = await navigator.serial.requestPort();

      // bufferSize: dahili alım tamponunu büyütüyoruz (varsayılan 255 byte
      // çoğu zaman "Buffer overrun" hatasının doğrudan sebebidir).
      await port.open({ baudRate: 115200, bufferSize: 16 * 1024 });
      currentPort = port;

      setStatus('Bağlandı (115200 baud)', '#81c784');
      btnConnect.disabled = true;

      // Sürekli döngü: overrun gibi kurtarılabilir hatalardan sonra
      // reader'ı yenileyip okumaya devam ediyoruz.
      while (port.readable) {
        const textDecoder = new TextDecoderStream();
        const readableClosed = port.readable.pipeTo(textDecoder.writable).catch(() => {});
        const reader = textDecoder.readable.getReader();
        currentReader = reader;

        const outcome = await readLoop(reader);

        try { await reader.cancel(); } catch (e) { /* yoksay */ }
        try { await readableClosed; } catch (e) { /* yoksay */ }

        if (outcome !== 'retry') break;
        // 'retry' ise dış while döngüsü yeni bir TextDecoderStream + reader kurar
      }

      try { await port.close(); } catch (e) { /* yoksay */ }
      currentPort = null;
      currentReader = null;
      btnConnect.disabled = false;
    }

    btnConnect.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        alert('Web Serial API is not supported in this browser. Please use Chrome or Edge.');
        return;
      }

      try {
        await connectAndStream();
      } catch (err) {
        setStatus('Hata: ' + err.message, '#e57373');
        btnConnect.disabled = false;
      }
    });

    /* ==========================================================================
       5. RENDER LOOP & RESIZE HANDLER
       ========================================================================== */
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
